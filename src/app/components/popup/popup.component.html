<form [formGroup]="myform" (ngSubmit)="Saveuser()">
    <h1 mat-dialog-title>{{inputdata.title}}</h1>
    <div mat-dialog-content>
       <mat-form-field>
        <mat-label>Nome</mat-label>
        <input formControlName="name" matInput>
       </mat-form-field>
       <mat-form-field>
        <mat-label>E-mail</mat-label>
        <input matInput formControlName="email">
       </mat-form-field>
       <mat-form-field>
        <mat-label>Telefone</mat-label>
        <input matInput formControlName="phone">
       </mat-form-field>
       <div>
        <mat-checkbox formControlName="status">Ativo</mat-checkbox>
       </div>
    </div>
    <div mat-dialog-actions>
        <button mat-raised-button type="submit" color="primary">Salvar</button>
      <a (click)="closepopup()" mat-raised-button color="warn">Cancelar</a>
      <!-- <button mat-raised-button [mat-dialog-close]="closemessage" color="accent">Cancel</button> -->
    </div>
    </form>
